name: Build All Versions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        version:
          - "7.0"
          - "7.1.3"
          - "7.2.2"
          - "7.3.5"
          - "7.4.11"
          - "7.5.3"
          - "7.6.3"
          - "7.7.3"
          - "7.8.7"
          - "8.0.3"
          - "8.1.3"
          - "8.2.3"
          - "8.3.7"
          - "8.4.1"
          - "8.5.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RenPy SDK
        run: |
          VERSION="${{ matrix.version }}"
          curl -L "https://www.renpy.org/dl/${VERSION}/renpy-${VERSION}-sdk.tar.bz2" \
            -o renpy-sdk.tar.bz2

      - name: Extract SDK
        run: |
          tar -xjf renpy-sdk.tar.bz2

      - name: Build Mac package
        run: |
          VERSION="${{ matrix.version }}"
          mkdir -p output
          "./renpy-${VERSION}-sdk/renpy.sh" "./renpy-${VERSION}-sdk/launcher" distribute "$(pwd)/stub_project" \
            --package mac \
            --destination ./output \
            --no-update

      - name: Debug - print output structure
        run: find ./output -print | sort

      - name: Rename artifact
        run: |
          VERSION="${{ matrix.version }}"
          ZIP=$(find ./output -name "*.zip" | head -1)
          mv "$ZIP" "./renpy-${VERSION}-mac-stub.zip"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ matrix.version }}"
          name: "RenPy ${{ matrix.version }} Mac Stub"
          files: "renpy-${{ matrix.version }}-mac-stub.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
